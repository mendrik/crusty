[package]
name = "rust-repo-intelligence"
version = "0.1.0"
edition = "2024"
description = "A local MCP change-intelligence service for Rust repositories"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8.2"
regex = "1.11"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.15"
