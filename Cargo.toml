[package]
name = "rust-repo-intelligence"
version = "0.3.0"
edition = "2024"
description = "A local MCP repository observatory for Rust projects"
license = "GPL-3.0-or-later"
repository = "https://github.com/mendrik/crusty"
readme = "README.md"
keywords = ["mcp", "rust", "code-analysis", "developer-tools"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
notify = "8.2"
rand = "0.9"
regex = "1.11"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
rmcp = { version = "3.1", features = ["transport-io"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
syn = { version = "2.0", features = ["full", "visit"] }
tokio = { version = "1.47", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
walkdir = "2.5"
tempfile = "3.15"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }
